name: Container image
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize main releases without cancelling an active deployment.
# Current-branch checks reject stale reruns; GitHub does not guarantee commit order.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/pocketcontext/wikicontext-demo

jobs:
  # Every branch and pull request: build for the runner's architecture and run the image.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd
            runner: ubuntu-24.04
          - arch: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Container entrypoint unit checks
        run: python3 tests/entrypoint.py
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wikicontext:ci
          build-args: REVISION=${{ github.sha }}
          provenance: false
          # Reuse this architecture's validated build cache during publication.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Show the image
        run: |
          docker image inspect wikicontext:ci --format 'image={{.Id}} architecture={{.Architecture}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
          docker run --rm --entrypoint sh wikicontext:ci -c 'set -eu; litestream version; pocketcontext --version; nginx -v; cat /app/POCKETCONTEXT_VERSION; find /app /usr/local/bin /usr/local/lib/wikicontext-demo -type f -not -path "/app/ui/dist/*" | sort; test ! -e /app/pb_hooks/.gitkeep'
      - name: Demo lifecycle with the image's server and Litestream
        run: |
          container=$(docker create wikicontext:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/pocketcontext" "$RUNNER_TEMP/pocketcontext-image"
          docker cp "$container:/usr/local/bin/litestream" "$RUNNER_TEMP/wikicontext-litestream"
          chmod +x "$RUNNER_TEMP/pocketcontext-image" "$RUNNER_TEMP/wikicontext-litestream"
          export WIKICONTEXT_TEST_BINARY="$RUNNER_TEMP/pocketcontext-image"
          export WIKICONTEXT_DEMO_TEST_BINARY="$RUNNER_TEMP/pocketcontext-image"
          export WIKICONTEXT_TEST_LITESTREAM="$RUNNER_TEMP/wikicontext-litestream"
          python3 tests/maintenance.py --binary "$WIKICONTEXT_TEST_BINARY"
          python3 -m unittest discover -s tests -p 'test_demo_*.py'
          python3 tests/demo_backend.py --binary "$WIKICONTEXT_TEST_BINARY"
      - name: Cloudflare client IP and direct-origin spoof resistance
        run: |
          docker run --rm --entrypoint python3 \
            -e WIKICONTEXT_TEST_REQUIRE_NGINX=true \
            -e WIKICONTEXT_TEST_ONCE_RUNTIME=/usr/local/bin/wikicontext-demo-once.py \
            --mount type=bind,src="$PWD/tests/test_demo_proxy_headers.py",dst=/tmp/test_demo_proxy_headers.py,readonly \
            wikicontext:ci /tmp/test_demo_proxy_headers.py
      - name: Child identity and writer lease isolation
        run: |
          docker run --rm --entrypoint python3 \
            -e WIKICONTEXT_TEST_REQUIRE_PRIVILEGES=true \
            -e WIKICONTEXT_TEST_ONCE_RUNTIME=/usr/local/bin/wikicontext-demo-once.py \
            -e WIKICONTEXT_TEST_CHILD_PRIVILEGES=/usr/local/lib/wikicontext-demo/child_privileges.py \
            --mount type=bind,src="$PWD/tests/test_demo_privileges.py",dst=/tmp/test_demo_privileges.py,readonly \
            wikicontext:ci /tmp/test_demo_privileges.py
      - name: Native ONCE bootstrap and exclusive volume
        run: python3 docker/once_smoke.py --image wikicontext:ci
      - name: Standard PocketDeploy lifecycle and populated recovery
        run: >-
          python3 docker/standard_demo_smoke.py --image wikicontext:ci
          --previous-image ghcr.io/pocketcontext/wikicontext-demo@sha256:d69f89e376e4b214ef0118a1c9c6eac86b12cc89637789681a1ed0ef9cb0a449
      - name: Startup errors for missing configuration
        run: python3 docker/smoke.py config --image wikicontext:ci
      - name: Smoke test
        run: python3 docker/smoke.py smoke --image wikicontext:ci
      - name: Object storage and strict Litestream recovery
        run: python3 docker/object_storage_smoke.py --image wikicontext:ci --minio-image wikicontext-minio-fixture:9e49d5e-7394ce0

  # Application validation runs once on every event, including pull requests.
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Each architecture is built on its own runner and pushed by digest, under no tag, so that two runs
  # close together cannot mix their halves in one manifest.
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WIKICONTEXT_DEMO_PUBLISH == 'true'
    needs:
      - check
      - tests
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publish the dedicated demo repository after every validation gate.
  demo_manifest:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WIKICONTEXT_DEMO_PUBLISH == 'true'
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require current demo revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale demo release: workflow revision is not current main.' >&2
            exit 1
          fi
      - name: Create and push the demo manifest
        id: publish
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          set -- *
          test "$#" -eq 2
          sources=()
          for digest in "$@"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo 'Invalid platform image digest.' >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --metadata-file "$RUNNER_TEMP/demo-manifest.json" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            "${sources[@]}"
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/demo-manifest.json")
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Invalid multi-platform image digest.' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Demo image: %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Show the immutable demo image
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE@$PUBLISHED_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-image-metadata
          path: ${{ runner.temp }}/demo-manifest.json
          if-no-files-found: error
          retention-days: 30

  demo_deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WIKICONTEXT_DEMO_DEPLOY_ENABLED == 'true' && vars.WIKICONTEXT_DEMO_DEPLOY_PAUSED != 'true'
    needs:
      - demo_manifest
    runs-on: ubuntu-24.04
    # Stop and readiness may each consume 15 minutes, plus pull and verification.
    timeout-minutes: 60
    permissions:
      contents: read
    environment:
      name: pocketdeploy-v2
    concurrency:
      group: deploy-wikicontext-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require current demo deployment revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ ! "$head" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo 'Refusing stale demo deployment.' >&2
            exit 1
          fi
      - name: Reconcile configured demo over restricted SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KNOWN_HOSTS"
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[a-z_][a-z0-9_-]{0,31}', os.environ['SERVER_USER']):
              raise SystemExit('Invalid configured SSH operator account')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.:-]*', os.environ['SERVER_IP']):
              raise SystemExit('Invalid configured SSH host')
          PY
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null 2>&1
          # The per-key forced command reconciles the host-configured latest image.
          # No remote command, registry credential, shell script or archive is sent.
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_IP" < /dev/null > "$RUNNER_TEMP/demo-receipt.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw = Path(os.environ['RUNNER_TEMP'], 'demo-receipt.json').read_bytes()
          if len(raw) > 4096:
              raise SystemExit('Invalid demo release receipt')
          receipt = json.loads(raw)
          if receipt != {'ok': True} or receipt.get('ok') is not True:
              raise SystemExit('Invalid PocketDeploy reconciliation receipt')
          PY
      - name: Verify running demo revision, assets and installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, tempfile, time
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          origin = 'https://wiki-demo.pocketcontext.com'
          def fetch(path, limit=4194304, base=origin):
              request = Request(base + path, headers={'User-Agent': 'WikiContext-Demo-Release-Check/1.0'})
              with urlopen(request, timeout=20) as response:
                  if response.status != 200 or response.geturl() != base + path:
                      raise ValueError('Unexpected public demo response')
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise ValueError('Public artifact exceeds limit')
                  return body
          def verify():
              runtime = json.loads(fetch('/up', 4096))
              revision = runtime.get('revision', '')
              if runtime.get('ready') is not True or not re.fullmatch(r'[0-9a-f]{40}', revision):
                  raise ValueError('Public demo runtime is not ready')
              trigger = os.environ['GITHUB_SHA']
              if not re.fullmatch(r'[0-9a-f]{40}', trigger):
                  raise ValueError('Invalid triggering revision')
              if revision != trigger:
                  # Reconciliation can adopt a newer main image while this job waits.
                  # Require both ancestry from this release and membership in main.
                  def github(path, query):
                      return subprocess.run(['gh', 'api', 'repos/pocketcontext/wikicontext-demo/' + path,
                          '--jq', query], check=True, capture_output=True, text=True).stdout.strip()
                  head = github('git/ref/heads/main', '.object.sha')
                  if not re.fullmatch(r'[0-9a-f]{40}', head):
                      raise ValueError('Invalid main revision')
                  if github('compare/' + trigger + '...' + revision, '.status') != 'ahead':
                      raise ValueError('Running revision does not include this release')
                  if github('compare/' + revision + '...' + head, '.status') not in ('ahead', 'identical'):
                      raise ValueError('Running revision is not on main')
              source = 'https://raw.githubusercontent.com/pocketcontext/wikicontext-demo/' + revision
              status = json.loads(fetch('/api/demo/status', 32768))
              day = datetime.now(timezone.utc).date().isoformat()
              if status.get('enabled') is not True or status.get('clientReady') is not True or status.get('generation') != day:
                  raise ValueError('Public demo is not ready for the current UTC generation')
              launcher = fetch('/skills/wikicontext/wikicontext', 65536, base=source).decode()
              pin = re.search(r'wikicontext-demo\.git", rev = "([0-9a-f]{40})"', launcher).group(1)
              expected_installation = {'method': 'skills', 'skill': 'wikicontext',
                  'source': 'https://github.com/pocketcontext/wikicontext-demo/tree/main/skills/wikicontext',
                  'clientRevision': pin}
              if status.get('installation') != expected_installation:
                  raise ValueError('Unexpected public installation contract')
              for path, name in (('/terms/', 'terms.html'), ('/privacy/', 'privacy.html'), ('/legal/legal.css', 'legal.css')):
                  expected = fetch('/legal/' + name, base=source)
                  if hashlib.sha256(fetch(path)).digest() != hashlib.sha256(expected).digest():
                      raise ValueError('Public legal assets differ from the running revision')
              # React assets are generated, so compare with the actual released image,
              # not a new local build or the workflow's possibly superseded checkout.
              image = 'ghcr.io/pocketcontext/wikicontext-demo:sha-' + revision
              def docker(*args):
                  return subprocess.run(['docker', *args], check=True, capture_output=True, text=True).stdout.strip()
              docker('pull', image)
              image_id = docker('image', 'inspect', image, '--format', '{{.Id}}')
              if docker('image', 'inspect', image_id, '--format', '{{index .Config.Labels "org.opencontainers.image.revision"}}') != revision:
                  raise ValueError('Released image revision mismatch')
              container = docker('create', image_id)
              try:
                  with tempfile.TemporaryDirectory() as directory:
                      docker('cp', container + ':/app/ui/dist/.', directory)
                      if not Path(directory, 'index.html').is_file():
                          raise ValueError('Released image has no reader entrypoint')
                      for artifact in Path(directory).rglob('*'):
                          if artifact.is_file():
                              relative = artifact.relative_to(directory).as_posix()
                              path = '/' if relative == 'index.html' else '/' + relative
                              if hashlib.sha256(fetch(path)).digest() != hashlib.sha256(artifact.read_bytes()).digest():
                                  raise ValueError('Public reader assets differ from released image')
              finally:
                  docker('rm', container)
              try:
                  fetch('/api/context/schema')
              except HTTPError as error:
                  error.close()
                  if error.code not in (401, 403):
                      raise ValueError('Anonymous SQL schema was not rejected') from None
              else:
                  raise ValueError('Anonymous SQL schema is available')
              if json.loads(fetch('/up', 4096)) != runtime:
                  raise ValueError('Demo runtime changed during verification')
              return revision
          for attempt in range(6):
              try:
                  revision = verify()
                  break
              except Exception:
                  if attempt == 5:
                      raise SystemExit('Public demo release attestation failed') from None
                  time.sleep(5)
          print('Verified running demo revision ' + revision + ', UTC generation, assets, installation and anonymous SQL rejection')
          PY
